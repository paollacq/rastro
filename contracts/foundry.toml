[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 1000

[lint]
# The RFQ keeps lowercase getters (usd(), brl(), admin()) so the TypeScript side reads naturally.
exclude_lints = ["screaming-snake-case-immutable"]

[rpc_endpoints]
moderato = "${TEMPO_RPC_URL}"

[fmt]
line_length = 110
